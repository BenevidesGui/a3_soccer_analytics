<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>A3-Soccer</title>
    <link rel="icon" type="image/png" href="/images/img5.png">

    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

<header class="header">
        <h1><img src="/images/img5.png" style="width: 100px; height: 100px; vertical-align: middle; margin-right: 10px;"> Soccer Analytics Dashboard</h1>
</header>

<main>

    <h2>Temporada: <span th:text="${season}"></span></h2>

    <form method="get" action="/dashboard">
        <input type="number" name="season" placeholder="Ano" min="2020" max="2024">
        <button type="submit">Trocar</button>
    </form>

    <div class="container">

        <div class="card"
             th:each="card : ${cards}"
             th:onclick="'window.location.href=\'/teams?league=' + ${card.id} + '&season=' + ${season} + '\''">

            <img th:src="${card.logo}" alt="Liga">
            <h3 th:text="${card.name}"></h3>

        </div>

    </div>

    <div class="analytics">
        <h2>Análises da Temporada</h2>
    </div>


    <div class="chart-container">
        <canvas id="goalsChart"></canvas>
    </div>


    <script th:inline="javascript">
        window.goalsData = /*[[${goals}]]*/ {};

        console.log("🔥 FRONT DATA:");
        console.log(window.goalsData);
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/script.js}"></script>

</main>
</body>
</html>
